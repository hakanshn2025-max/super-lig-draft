function createPlayers(){

return RAW_PLAYERS.map((p,i)=>({

id:i,
pos:p[0],

}));

/* =====================================================

===================================================== */

let state={

name:"",

team:"",

peer:null,

roomId:"",

isHost:false,

myId:"",

hostId:"",

connections:{},

managers:[],

players:createPlayers(),

turn:0,

timer:30,

gameStarted:false,

search:"",

filter:"ALL"

};

let timerInterval=null;

const app=document.getElementById("app");
const toastBox=document.getElementById("toast");


/* =====================================================

}).format(n);

/* =====================================================

function render(){

function join(){

</select>

<input id="room"
placeholder="Hostun verdiği oda kodunu yapıştır">

<button class="btn green"
onclick="joinRoom()">
🌐 ODAYA KATIL
</button>

<button class="btn"
onclick="state.screen='home';render()">
GERİ
</button>

/* =====================================================
   PEER TEMİZLE
===================================================== */

function destroyPeer(){

try{

if(state.peer){

state.peer.destroy();

}

}catch(e){}

state.peer=null;
state.connections={};

}


/* =====================================================
   ODA OLUŞTUR
===================================================== */

function createRoom(){

const name=document.getElementById("name").value.trim();
const team=document.getElementById("team").value;

if(!name||!team){

toast("⚠️ İsim ve takım seç.");

return;

}

destroyPeer();

state.name=name;
state.team=team;
state.isHost=true;
state.gameStarted=false;
state.players=createPlayers();


/*
 PeerJS'nin kendi benzersiz ID'sini üretmesine izin veriyoruz.
*/

state.peer=new Peer();

state.peer.on("open",id=>{

state.myId=id;
state.roomId=id;
state.hostId=id;

state.managers=[{

id:id,
name:name,
team:team,
money:BUDGET

}];

state.screen="lobby";

render();

toast("✅ Oda oluşturuldu!");

});


state.peer.on("connection",conn=>{

acceptConnection(conn);

});


state.peer.on("error",err=>{

console.log("HOST ERROR:",err);

if(err.type==="network"){

toast("❌ İnternet/PeerJS bağlantısı yok.");

}else{

toast("❌ PeerJS: "+err.type);

}

});

}


/* =====================================================
   ODAYA KATIL
===================================================== */

function joinRoom(){

const name=document.getElementById("name").value.trim();
const team=document.getElementById("team").value;
const room=document.getElementById("room").value.trim();

if(!name||!team||!room){

toast("⚠️ Bilgileri doldur.");

return;

}

destroyPeer();

state.name=name;
state.team=team;
state.roomId=room;
state.isHost=false;

state.peer=new Peer();

state.peer.on("open",myId=>{

state.myId=myId;

console.log("Kendi ID:",myId);
console.log("Host ID:",room);


/*
 Burada doğrudan HOSTUN GERÇEK PEER ID'SİNE
 bağlanıyoruz.
*/

const conn=state.peer.connect(room,{
reliable:true
});

state.connections.host=conn;

let timeout=setTimeout(()=>{

if(!conn.open){

toast("❌ Oda bulunamadı. Host ekranını açık tut.");

}

},12000);


conn.on("open",()=>{

clearTimeout(timeout);

console.log("HOST BAĞLANTISI AÇILDI");

conn.send({

type:"JOIN",

id:myId,
name:name,
team:team

});

state.screen="lobby";

render();

toast("🟢 Odaya bağlandın!");

});


conn.on("data",receiveData);


conn.on("error",err=>{

console.log("CONNECTION ERROR:",err);

toast("❌ Host bağlantı hatası.");

});


conn.on("close",()=>{

toast("⚠️ Host bağlantısı kapandı.");

});

});


state.peer.on("error",err=>{

console.log("JOIN PEER ERROR:",err);

if(err.type==="peer-unavailable"){

toast("❌ Oda bulunamadı. Kodu eksiksiz yapıştır.");

}

else if(err.type==="network"){

toast("❌ İnternet bağlantısı kurulamadı.");

}

else{

toast("❌ PeerJS: "+err.type);

}

});

}


/* =====================================================
   HOST BAĞLANTI KABUL
===================================================== */

function acceptConnection(conn){

conn.on("open",()=>{

console.log("Oyuncu bağlandı:",conn.peer);

});


conn.on("data",data=>{

console.log("HOST DATA:",data);

if(data.type==="JOIN"){

handleJoin(conn,data);

}

else{

handleHostData(data);

}

});


conn.on("close",()=>{

const id=conn.peer;

delete state.connections[id];

state.managers=
state.managers.filter(m=>m.id!==id);

broadcastLobby();

});

}


/* =====================================================
   JOIN HANDLE
===================================================== */

function handleJoin(conn,data){

if(state.managers.length>=MAX_PLAYERS){

conn.send({

type:"FULL"

});

return;

}

if(state.gameStarted){

conn.send({

type:"STARTED"

});

return;

}

if(!state.managers.find(m=>m.id===data.id)){

state.managers.push({

id:data.id,
name:data.name,
team:data.team,
money:BUDGET

});

}

state.connections[data.id]=conn;


/*
 Yeni oyuncuya mevcut durum
*/

conn.send({

type:"WELCOME",

hostId:state.myId,

players:state.players,

managers:state.managers,

turn:state.turn,

gameStarted:state.gameStarted

});


broadcastLobby();

render();

toast("👤 "+data.name+" odaya katıldı.");

}


/* =====================================================
   HOST DATA
===================================================== */

function handleHostData(data){

if(data.type==="PICK"){

hostPick(
data.playerId,
data.managerId
);

}

}


/* =====================================================
   BROADCAST
===================================================== */

function broadcast(data){

Object.values(state.connections).forEach(conn=>{

if(conn&&conn.open){

try{

conn.send(data);

}catch(e){

console.log(e);

}

}

});

}


/* =====================================================
   LOBBY BROADCAST
===================================================== */

function broadcastLobby(){

broadcast({

type:"LOBBY",

managers:state.managers,
gameStarted:state.gameStarted

});

}


/* =====================================================
   OYUN BAŞLAT
===================================================== */

function startGame(){

if(!state.isHost)return;

if(state.managers.length<2){

toast("⚠️ En az 2 kişi gerekli.");

return;

}

state.gameStarted=true;
state.turn=0;
state.timer=30;

broadcast({

type:"GAME_START",

players:state.players,
managers:state.managers,
turn:state.turn,
timer:30

});

state.screen="game";

render();

startTimer();

toast("🚀 Oyun başladı!");

}


/* =====================================================
   CURRENT MANAGER
===================================================== */

function currentManager(){

return state.managers[state.turn]||null;

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

clearInterval(timerInterval);

timerInterval=setInterval(()=>{

if(!state.gameStarted){

clearInterval(timerInterval);

return;

}

state.timer--;

const timer=document.getElementById("timer");

if(timer){

timer.textContent=state.timer;

}

if(state.timer<=0){

if(state.isHost){

nextTurn();

}

}

},1000);

}


/* =====================================================
   NEXT TURN
===================================================== */

function nextTurn(){

if(!state.isHost)return;

if(!state.managers.length)return;

state.turn++;

if(state.turn>=state.managers.length){

state.turn=0;

}

state.timer=30;

broadcast({

type:"STATE",

players:state.players,

managers:state.managers,

turn:state.turn,

timer:30

});

render();

}


/* =====================================================
   BUY PLAYER
===================================================== */

function buyPlayer(id){

const player=
state.players.find(p=>p.id===id);

if(!player)return;

if(!state.gameStarted){

toast("⚠️ Oyun başlamadı.");

return;

}

const manager=currentManager();

if(!manager)return;

if(manager.id!==state.myId){

toast("⏳ Sıra sende değil.");

return;

}

if(player.owner){

toast("🔒 Bu futbolcu alındı.");

return;

}

if(manager.money<player.value){

toast("💰 Bütçen yetmiyor.");

return;

}

if(state.isHost){

hostPick(id,state.myId);

return;

}

const conn=state.connections.host;

if(!conn||!conn.open){

toast("❌ Host bağlantısı yok.");

return;

}

conn.send({

type:"PICK",

playerId:id,
managerId:state.myId

});

}


/* =====================================================
   HOST PICK
===================================================== */

function hostPick(playerId,managerId){

if(!state.isHost)return;

const manager=
state.managers.find(m=>m.id===managerId);

const player=
state.players.find(p=>p.id===playerId);

if(!manager||!player)return;

const current=currentManager();

if(!current||current.id!==managerId){

return;

}

if(player.owner){

return;

}

if(manager.money<player.value){

return;

}

player.owner=managerId;

manager.money-=player.value;


/*
 Önce seçimi gönder
*/

broadcast({

type:"PICKED",

player:player,

players:state.players,

managers:state.managers,

turn:state.turn,

timer:30

});

render();

toast("⚽ "+player.name+" → "+manager.name);


/*
 1 saniye sonra sıra
*/

setTimeout(()=>{

nextTurn();

},1000);

}


/* =====================================================
   RECEIVE DATA
===================================================== */

function receiveData(data){

console.log("CLIENT DATA:",data);


if(data.type==="WELCOME"){

state.hostId=data.hostId;

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.gameStarted=data.gameStarted;

state.timer=30;

render();

return;

}


if(data.type==="LOBBY"){

state.managers=data.managers;

state.gameStarted=data.gameStarted;

render();

return;

}


if(data.type==="GAME_START"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.timer=data.timer||30;

state.gameStarted=true;

state.screen="game";

render();

startTimer();

toast("🚀 Draft başladı!");

return;

}


if(data.type==="PICKED"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.timer=data.timer||30;

const player=data.player;

const manager=
state.managers.find(m=>m.id===player.owner);

if(manager){

toast(
"🔒 "+player.name+
" → "+manager.name
);

}

render();

return;

}


if(data.type==="STATE"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.timer=data.timer||30;

render();

return;

}


if(data.type==="FULL"){

toast("❌ Oda dolu. Maksimum 4 kişi.");

return;

}


if(data.type==="STARTED"){

toast("❌ Bu oyun zaten başlamış.");

return;

}

}

function lobby(){

const count=state.managers.length;

app.innerHTML=`

${state.managers.map((m,i)=>`

function mySquad(){

const squad=
state.players.filter(p=>p.owner===state.myId);

return `

<div class="pitch">

<div class="pitchTitle">
🏟️ KADROM ${squad.length}/11
</div>

<div class="lineup">

${Array.from({length:11},(_,i)=>{

const p=squad[i];

return `

<div class="slot ${p?"full":""}">

${p?p.name:"+ "+(i+1)}

</div>

`;

}).join("")}

</div>

</div>

`;

}


/* =====================================================
   PLAYER LIST
===================================================== */

function playerList(){

return state.players

.filter(p=>{

if(state.filter!=="ALL"&&p.pos!==state.filter){

return false;

}

if(state.search){

const s=state.search.toLowerCase();

return(
p.name.toLowerCase().includes(s)||
p.club.toLowerCase().includes(s)
);

}

return true;

})

.map(p=>{

const owner=
state.managers.find(m=>m.id===p.owner);

const myTurn=
currentManager()&&
currentManager().id===state.myId;

return `

<div class="player ${p.owner?"taken":""}">

<div class="pos">
${posName(p.pos)}
</div>

<div class="playerName">
${p.name}
</div>

<div class="club">
${p.club}
</div>

<div class="value">
${money(p.value)}
</div>


${p.owner?`

<div class="notice">
🔒 ${owner?owner.name:"ALINDI"}
</div>

`:`

<button
onclick="buyPlayer(${p.id})"
${!myTurn?"disabled":""}>

💰 KADROYA AL

</button>

`}

</div>

`;

}).join("");

}


/* =====================================================
   SEARCH
===================================================== */

function searchPlayers(value){

state.search=value;

const box=document.querySelector(".players");

if(box){

box.innerHTML=playerList();

}

}

   FILTER
===================================================== */

function setFilter(value){

state.filter=value;

render();

}

render();
