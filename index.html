<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Süper Lig Draft Online</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#06111f;color:#fff;
font-family:Arial,sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
#app{max-width:700px;margin:auto;padding:14px}
.logo{
text-align:center;font-size:29px;font-weight:900;
color:#a8ff00;margin:15px 0 5px
}
.subtitle{text-align:center;color:#9fb0c8;margin-bottom:18px}
.card{
background:#101e33;border:1px solid #29415f;
border-radius:18px;padding:16px;margin-bottom:13px
}
.btn{
width:100%;border:0;border-radius:13px;padding:15px;
margin:6px 0;background:#1b2d47;color:#fff;font-weight:900
}
.btn.green{background:#a8ff00;color:#06111f}
input,select{
width:100%;padding:14px;margin:5px 0;border-radius:11px;
border:1px solid #29415f;background:#091727;color:#fff
}
.room{
font-size:34px;font-weight:900;letter-spacing:5px;
text-align:center;color:#a8ff00;padding:12px
}
.notice{
background:#091727;border:1px solid #29415f;
border-radius:11px;padding:10px;margin:6px 0
}
.roomBox{
background:#0c1a2c;border:1px solid #29415f;
border-radius:14px;padding:12px;margin:8px 0
}
.roomTitle{font-size:18px;font-weight:900}
.roomInfo{font-size:13px;color:#9fb0c8;margin:5px 0}
.top{
display:flex;justify-content:space-between;align-items:center;
background:#101e33;border:1px solid #29415f;
border-radius:13px;padding:11px;margin-bottom:9px
}
.money{color:#ffd166;font-weight:900}
.timer{color:#a8ff00;font-size:25px;font-weight:900}
.players{
display:grid;grid-template-columns:repeat(2,1fr);gap:9px
}
.player{
background:#0c1a2c;border:1px solid #29415f;
border-radius:14px;padding:11px
}
.player.taken{opacity:.4}
.pos{font-size:10px;font-weight:900;color:#54a8ff}
.playerName{font-weight:900;margin:5px 0}
.club{font-size:12px;color:#9fb0c8}
.value{color:#ffd166;font-weight:900;font-size:13px;margin-top:7px}
.player button{
width:100%;border:0;border-radius:9px;padding:9px;
margin-top:8px;background:#a8ff00;font-weight:900
}
.toast{
position:fixed;bottom:25px;left:50%;
transform:translateX(-50%);background:#fff;color:#06111f;
padding:13px 18px;border-radius:12px;font-weight:900;
z-index:9999;box-shadow:0 5px 30px #0008
}
.hidden{display:none}
@media(max-width:450px){.players{grid-template-columns:1fr}}
</style>
</head>

<body>

<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script type="module">

/* =========================================================
   ÜCRETSİZ ORTAK ODA SİSTEMİ
   Firebase bilgilerini daha sonra buraya koyacağız.
========================================================= */

const firebaseConfig={
apiKey:"BURAYA_API_KEY",
authDomain:"BURAYA.firebaseapp.com",
databaseURL:"https://BURAYA-default-rtdb.firebaseio.com",
projectId:"BURAYA",
storageBucket:"BURAYA.firebasestorage.app",
messagingSenderId:"BURAYA",
appId:"BURAYA"
};

import{initializeApp}
from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import{
getDatabase,ref,set,get,update,onValue
}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseApp=initializeApp(firebaseConfig);
const db=getDatabase(firebaseApp);


/* =========================================================
   AYARLAR
========================================================= */

const BUDGET=500000000;
const MAX_PLAYERS=4;


/* =========================================================
   OYUNCULAR
========================================================= */

const RAW_PLAYERS=[

["GK","Uğurcan Çakır","Galatasaray",15000000],
["GK","Günay Güvenç","Galatasaray",1200000],

["DF","Davinson Sánchez","Galatasaray",20000000],
["DF","Abdülkerim Bardakcı","Galatasaray",10000000],
["DF","Kaan Ayhan","Galatasaray",4000000],
["DF","Elias Jelert","Galatasaray",7000000],
["DF","Ismail Jakobs","Galatasaray",5000000],

["MF","Lucas Torreira","Galatasaray",14000000],
["MF","Gabriel Sara","Galatasaray",27000000],
["MF","Leroy Sané","Galatasaray",35000000],
["MF","Barış Alper Yılmaz","Galatasaray",30000000],
["MF","Yunus Akgün","Galatasaray",12000000],

["FW","Victor Osimhen","Galatasaray",75000000],
["FW","Mauro Icardi","Galatasaray",8000000],

["GK","Dominik Livaković","Fenerbahçe",4000000],

["DF","Jayden Oosterwolde","Fenerbahçe",13000000],
["DF","Çağlar Söyüncü","Fenerbahçe",10000000],
["DF","Alexander Djiku","Fenerbahçe",7000000],
["DF","Milan Škriniar","Fenerbahçe",12000000],

["MF","Fred","Fenerbahçe",14000000],
["MF","İsmail Yüksek","Fenerbahçe",14000000],
["MF","Sebastian Szymański","Fenerbahçe",19000000],
["MF","Sofyan Amrabat","Fenerbahçe",12000000],

["FW","Mason Greenwood","Fenerbahçe",55000000],
["FW","Marco Asensio","Fenerbahçe",25000000],
["FW","Youssef En-Nesyri","Fenerbahçe",22000000],

["GK","Alexander Nübel","Beşiktaş",12000000],

["DF","Felix Uduokhai","Beşiktaş",7000000],
["DF","Emirhan Topçu","Beşiktaş",6000000],
["DF","Yasin Özcan","Beşiktaş",4000000],

["MF","Gedson Fernandes","Beşiktaş",17000000],
["MF","Rafa Silva","Beşiktaş",10000000],
["MF","Kristjan Asllani","Beşiktaş",10000000],

["FW","Leandro Trossard","Beşiktaş",18000000],
["FW","Semih Kılıçsoy","Beşiktaş",15000000],

["GK","André Onana","Trabzonspor",10000000],

["DF","Arseniy Batagov","Trabzonspor",11000000],
["DF","Stefan Savić","Trabzonspor",2500000],
["DF","Cenk Özkacar","Trabzonspor",5000000],

["MF","Ruslan Malinovskyi","Trabzonspor",5000000],
["MF","Muhammed Cham","Trabzonspor",7000000],
["MF","Ernest Muçi","Trabzonspor",10000000],

["FW","Mohamed Salah","Trabzonspor",30000000],
["FW","Paul Onuachu","Trabzonspor",10000000],
["FW","Simon Banza","Trabzonspor",12000000]

];

function players(){

return RAW_PLAYERS.map((p,i)=>({
id:i,
pos:p[0],
name:p[1],
club:p[2],
value:p[3],
owner:""
}));

}


/* =========================================================
   STATE
========================================================= */

let state={
screen:"home",
name:"",
team:"",
roomId:"",
password:"",
myId:"",
isHost:false,
room:null,
unsubscribe:null
};

const app=document.getElementById("app");
const toastBox=document.getElementById("toast");


/* =========================================================
   YARDIMCI
========================================================= */

function money(n){

return new Intl.NumberFormat("tr-TR",{
style:"currency",
currency:"EUR",
maximumFractionDigits:0
}).format(n);

}

function toast(t){

toastBox.textContent=t;
toastBox.classList.remove("hidden");

clearTimeout(window.tt);

window.tt=setTimeout(()=>{
toastBox.classList.add("hidden")
},2500);

}

function randomCode(){

return Math.floor(100000+Math.random()*900000).toString();

}

function randomId(){

return Date.now()+"_"+Math.random()
.toString(36).slice(2,8);

}


/* =========================================================
   ANA SAYFA
========================================================= */

function home(){

state.screen="home";

app.innerHTML=`

<div class="logo">⚽ SÜPER LİG DRAFT</div>

<div class="subtitle">
ONLINE • 2-4 KİŞİ
</div>

<div class="card">

<button class="btn green"
onclick="createPage()">

🏠 ODA OLUŞTUR

</button>

</div>

<div class="card">

<h3>🌐 AÇIK ODALAR</h3>

<div id="roomList">

<div class="notice">
⏳ Odalar yükleniyor...
</div>

</div>

</div>
`;

listenRooms();

}


/* =========================================================
   ODA LİSTESİ
========================================================= */

function listenRooms(){

onValue(ref(db,"rooms"),snapshot=>{

const data=snapshot.val()||{};
const box=document.getElementById("roomList");

if(!box)return;

const rooms=Object.entries(data)
.filter(([_,r])=>r.status==="waiting");

if(!rooms.length){

box.innerHTML=`
<div class="notice">
🏠 Şu anda açık oda yok.
</div>`;
return;

}

box.innerHTML=rooms.map(([code,r])=>`

<div class="roomBox">

<div class="roomTitle">
🔥 ${r.name}
</div>

<div class="roomInfo">
👥 ${r.count||1}/4 &nbsp; 🔐 Şifreli
</div>

<button class="btn green"
onclick="passwordPage('${code}')">

🚪 ODAYA GİR

</button>

</div>

`).join("");

});

}


/* =========================================================
   ODA OLUŞTURMA SAYFASI
========================================================= */

function createPage(){

app.innerHTML=`

<div class="logo">
🏠 ODA OLUŞTUR
</div>

<div class="card">

<input id="name"
placeholder="Menajer adın">

<input id="team"
placeholder="Takımın">

<input id="password"
type="password"
placeholder="Oda şifresi">

<button class="btn green"
onclick="createRoom()">

🚀 ODAYI OLUŞTUR

</button>

<button class="btn"
onclick="home()">

GERİ

</button>

</div>
`;

}


/* =========================================================
   ODA OLUŞTUR
========================================================= */

async function createRoom(){

const name=document.getElementById("name").value.trim();
const team=document.getElementById("team").value.trim();
const password=document.getElementById("password").value.trim();

if(!name||!team||!password){

toast("⚠️ Bilgileri doldur.");
return;

}

const code=randomCode();
const me=randomId();

const roomPlayers={};

players().forEach(p=>{
roomPlayers[p.id]=p;
});

state.name=name;
state.team=team;
state.password=password;
state.roomId=code;
state.myId=me;
state.isHost=true;

const data={

name:name+"'in Odası",
password:password,
status:"waiting",
count:1,
turn:0,
timer:30,

managers:{
[me]:{
id:me,
name:name,
team:team,
money:BUDGET
}
},

players:roomPlayers

};

try{

await set(ref(db,"rooms/"+code),data);

openRoom(code);

}catch(e){

console.log(e);
toast("Firebase bağlantısı hazır değil.");

}

}


/* =========================================================
   ŞİFRE SAYFASI
========================================================= */

function passwordPage(code){

app.innerHTML=`

<div class="logo">
🔐 ODAYA GİR
</div>

<div class="card">

<div class="room">
${code}
</div>

<input id="joinName"
placeholder="Menajer adın">

<input id="joinTeam"
placeholder="Takımın">

<input id="joinPassword"
type="password"
placeholder="Oda şifresi">

<button class="btn green"
onclick="joinRoom('${code}')">

🔓 ODAYA GİR

</button>

<button class="btn"
onclick="home()">

GERİ

</button>

</div>
`;

}


/* =========================================================
   ODAYA GİR
========================================================= */

async function joinRoom(code){

const name=document.getElementById("joinName").value.trim();
const team=document.getElementById("joinTeam").value.trim();
const password=document.getElementById("joinPassword").value.trim();

if(!name||!team||!password){

toast("⚠️ Bilgileri doldur.");
return;

}

const snap=await get(ref(db,"rooms/"+code));

if(!snap.exists()){

toast("❌ Oda bulunamadı.");
return;

}

const room=snap.val();

if(room.password!==password){

toast("❌ Şifre yanlış.");
return;

}

if((room.count||0)>=MAX_PLAYERS){

toast("❌ Oda dolu.");
return;

}

const me=randomId();

await update(
ref(db,"rooms/"+code+"/managers/"+me),
{
id:me,
name:name,
team:team,
money:BUDGET
}
);

await update(
ref(db,"rooms/"+code),
{
count:(room.count||0)+1
}
);

state.name=name;
state.team=team;
state.password=password;
state.roomId=code;
state.myId=me;
state.isHost=false;

openRoom(code);

toast("✅ Odaya katıldın!");

}


/* =========================================================
   ODAYI AÇ
========================================================= */

function openRoom(code){

state.screen="lobby";

state.roomId=code;

listenRoom(code);

}


/* =========================================================
   ODAYI DİNLE
========================================================= */

function listenRoom(code){

if(state.unsubscribe)
state.unsubscribe();

state.unsubscribe=onValue(
ref(db,"rooms/"+code),
snap=>{

if(!snap.exists()){

toast("❌ Oda kapandı.");
home();
return;

}

state.room=snap.val();

if(state.room.status==="playing")
state.screen="game";
else
state.screen="lobby";

render();

});

}


/* =========================================================
   LOBİ
========================================================= */

function lobby(){

const managers=
Object.values(state.room.managers||{});

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🔑 ODA KODU</h2>

<div class="room">
${state.roomId}
</div>

<div class="notice">
🔐 Şifre: <b>${state.password}</b>
</div>

</div>

<div class="card">

<h3>👥 OYUNCULAR ${managers.length}/4</h3>

${managers.map((m,i)=>`

<div class="notice">

${i===0?"👑 ":""}
<b>${m.name}</b>

<br>

<span style="color:#9fb0c8">
${m.team}
</span>

</div>

`).join("")}

</div>

${state.isHost?`

<div class="card">

<button class="btn green"
onclick="startGame()"
${managers.length<2?"disabled":""}>

🚀 OYUNU BAŞLAT

</button>

</div>

`:

`

<div class="card">

<div class="notice">
⏳ Oda sahibinin oyunu başlatması bekleniyor.
</div>

</div>

`}

`;

}


/* =========================================================
   OYUN BAŞLAT
========================================================= */

async function startGame(){

const managers=
Object.values(state.room.managers||{});

if(managers.length<2){

toast("⚠️ En az 2 kişi gerekli.");
return;

}

await update(
ref(db,"rooms/"+state.roomId),
{
status:"playing",
turn:0,
timer:30
}
);

}


/* =========================================================
   OYUNCU AL
========================================================= */

async function buyPlayer(id){

const room=state.room;

const managers=
Object.values(room.managers||{});

const current=
managers[room.turn||0];

if(current.id!==state.myId){

toast("⏳ Sıra sende değil!");
return;

}

const player=room.players[id];

if(!player)return;

if(player.owner){

toast("🔒 Bu oyuncu alındı.");
return;

}

if(current.money<player.value){

toast("💰 Bütçen yetmiyor.");
return;

}

await update(
ref(db,"rooms/"+state.roomId+
"/players/"+id),
{
owner:state.myId
}
);

await update(
ref(db,"rooms/"+state.roomId+
"/managers/"+state.myId),
{
money:current.money-player.value
}
);

const next=(room.turn+1)%managers.length;

await update(
ref(db,"rooms/"+state.roomId),
{
turn:next,
timer:30
}
);

toast("⚽ "+player.name+" kadroya alındı!");

}


/* =========================================================
   OYUN
========================================================= */

function game(){

const managers=
Object.values(state.room.managers||{});

const me=
managers.find(x=>x.id===state.myId);

const current=
managers[state.room.turn||0];

const list=
Object.values(state.room.players||{});

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="top">

<div>
<b>${state.name}</b>
<br>
<span style="color:#9fb0c8">
${state.team}
</span>
</div>

<div class="money">
${money(me?.money||BUDGET)}
</div>

</div>

<div class="top">

<div>
<span style="font-size:11px;color:#9fb0c8">
SIRA
</span>
<br>
<b>${current?.name||"-"}</b>
</div>

<div class="timer">
${state.room.timer||30}
</div>

</div>

<div class="card">

<h3>👥 MENAJERLER</h3>

${managers.map((m,i)=>`

<div class="notice"
style="${i===state.room.turn?
"border-color:#a8ff00":""}">

${i===state.room.turn?"🔥 ":""}

<b>${m.name}</b>

<br>

<span style="color:#9fb0c8">
${m.team}
</span>

<br>

<span style="color:#ffd166">
${money(m.money)}
</span>

</div>

`).join("")}

</div>

<div class="card">

<h2>⚽ OYUNCU HAVUZU</h2>

<div class="players">

${list.map(p=>{

const owner=
managers.find(m=>m.id===p.owner);

return`

<div class="player ${p.owner?"taken":""}">

<div class="pos">
${p.pos}
</div>

<div class="playerName">
${p.name}
</div>

<div class="club">
${p.club}
</div>

<div class="value">
${money(p.value)}
</div>

${p.owner?

`<div class="notice">
🔒 ${owner?.name||"ALINDI"}
</div>`

:

`<button onclick="buyPlayer(${p.id})">
💰 KADROYA AL
</button>`

}

</div>

`;

}).join("")}

</div>

</div>

`;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

if(state.screen==="home")home();

if(state.screen==="lobby"&&state.room)
lobby();

if(state.screen==="game"&&state.room)
game();

}

window.home=home;
window.createPage=createPage;
window.createRoom=createRoom;
window.passwordPage=passwordPage;
window.joinRoom=joinRoom;
window.startGame=startGame;
window.buyPlayer=buyPlayer;

home();

</script>

</body>
</html>
