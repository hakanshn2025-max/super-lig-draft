<!DOCTYPE html>

<title>Süper Lig Draft Online</title>

<style>

*{

}

body{
margin:0;
background:#06111f;
color:white;

}

button,input,select{

}

button{

}

button:disabled{

cursor:not-allowed;
}

}

.logo{

}

}

.card{
background:#101e33;

border-radius:18px;
padding:16px;

}

.btn{

border:0;
border-radius:13px;
padding:15px;

}

.btn.green{

}

input,select{
width:100%;

}

input:focus,
select:focus{

}

.room{
font-size:35px;
font-weight:900;

color:#a8ff00;

}

.top{

.money{

.timer{

font-size:25px;

}

.players{
display:grid;
grid-template-columns:repeat(2,1fr);

}

.player{
background:#0c1a2c;

}

.player.taken{

}

.pos{

}

.playerName{

.club{

}

.player button{

border-radius:9px;
padding:9px;
margin-top:8px;
background:#a8ff00;

}

.notice{
background:#091727;
border:1px solid #29415f;
border-radius:11px;
padding:10px;
margin:6px 0;
}

.notice.greenBorder{
border-color:#a8ff00;
}

.tabs{
display:flex;
gap:5px;
overflow-x:auto;
margin-bottom:10px;
}

.tab{
border:1px solid #29415f;
background:#101e33;
color:#9fb0c8;
padding:9px 12px;
border-radius:9px;
font-weight:900;

}

.tab.active{
background:#a8ff00;
color:#06111f;
}

.pitch{
background:#13833a;
border:3px solid #ffffff77;
border-radius:17px;
padding:13px;
margin-bottom:13px;
}

.pitchTitle{
text-align:center;
font-weight:900;
margin-bottom:9px;
}

.lineup{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}

.slot{
min-height:63px;
border:2px dashed #ffffff77;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-size:10px;
padding:4px;
}

.slot.full{
background:#0005;
border-style:solid;
}

.status{
text-align:center;
font-size:12px;
color:#9fb0c8;
padding:8px;
}

.status.online{
color:#a8ff00;
}

.toast{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);
background:white;
color:#06111f;
padding:13px 18px;
border-radius:12px;
font-weight:900;
z-index:9999;
box-shadow:0 5px 30px #0008;
max-width:90%;
text-align:center;
}

.hidden{
display:none;
}

@media(max-width:450px){

.players{
grid-template-columns:1fr;
}

.room{
font-size:30px;
}

}

</style>
</head>

["FW","Paul Onuachu","Trabzonspor",10000000],

/* =========================================================
   OYUNCULARI OLUŞTUR
========================================================= */

function createPlayers(){

return RAW_PLAYERS.map((p,i)=>({

id:i,
pos:p[0],
name:p[1],
club:p[2],
value:p[3],
owner:null

}));

}


/* =========================================================
   OYUN DURUMU
========================================================= */

let state = {

screen:"home",

name:"",

team:"",

peer:null,

roomId:"",

peerRoomId:"",

isHost:false,

myId:"",

connections:{},

managers:[],

players:createPlayers(),

turn:0,

timer:30,

gameStarted:false,

search:"",

filter:"ALL",

connecting:false

};

let timerInterval=null;


/* =========================================================
   ELEMENTLER
========================================================= */

const app=document.getElementById("app");

const toastBox=document.getElementById("toast");


/* =========================================================
   YARDIMCI
========================================================= */

function money(n){

return new Intl.NumberFormat("tr-TR",{

style:"currency",

currency:"EUR",

maximumFractionDigits:0

}).format(n);

}


function toast(text){

toastBox.textContent=text;

toastBox.classList.remove("hidden");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{

toastBox.classList.add("hidden");

},2800);

}


function posName(pos){

if(pos==="GK") return "KALECİ";

if(pos==="DF") return "DEFANS";

if(pos==="MF") return "ORTA SAHA";

return "FORVET";

}


/* =========================================================
   EKRAN
========================================================= */

function render(){

if(state.screen==="home") home();

else if(state.screen==="create") create();

else if(state.screen==="join") join();

else if(state.screen==="lobby") lobby();

else if(state.screen==="game") game();

}


/* =========================================================
   ANA SAYFA
========================================================= */

function home(){

<div class="logo">

</div>

<div class="subtitle">

</div>

<div class="card">

onclick="state.screen='create';render()">

onclick="state.screen='join';render()">

</button>

</div>

</div>

</div>

</div>

/* =========================================================
   ODA OLUŞTUR
========================================================= */

function create(){

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🏠 Oda Oluştur</h2>

<input
id="name"
placeholder="Menajer adın"
maxlength="20"
>

<select id="team">

<option value="">Takımını seç</option>

<option>Galatasaray</option>
<option>Fenerbahçe</option>
<option>Beşiktaş</option>
<option>Trabzonspor</option>

</select>

<button class="btn green"
onclick="createRoom()">

🚀 ODAYI OLUŞTUR

</button>

<button class="btn"
onclick="state.screen='home';render()">

GERİ

</button>

</div>

`;

}


/* =========================================================
   ODAYA KATIL
========================================================= */

function join(){

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🚪 Odaya Katıl</h2>

<input
id="name"
placeholder="Menajer adın"
maxlength="20"
>

<select id="team">

<option value="">Takımını seç</option>

<option>Galatasaray</option>
<option>Fenerbahçe</option>
<option>Beşiktaş</option>
<option>Trabzonspor</option>

</select>

<input
id="room"
placeholder="Örn: AB12CD"
maxlength="6"
style="text-transform:uppercase"
>

<button class="btn green"
onclick="joinRoom()">

🌐 ODAYA KATIL

</button>

<button class="btn"
onclick="state.screen='home';render()">

GERİ

</button>

</div>

<div class="card">

<div class="notice">

💡 Hostun verdiği 6 haneli oda kodunu buraya yaz.

</div>

</div>

`;

}


/* =========================================================
   ODA KODU OLUŞTUR
========================================================= */

function generateRoomCode(){

const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code="";

for(let i=0;i<6;i++){

code+=chars[Math.floor(Math.random()*chars.length)];

}

return code;

}


/* =========================================================
   ODA OLUŞTUR
========================================================= */

function createRoom(){

const name=document.getElementById("name").value.trim();

const team=document.getElementById("team").value;


if(!name || !team){

toast("⚠️ İsim ve takımını seç.");

return;

}


state.name=name;

state.team=team;

state.isHost=true;

state.connecting=true;


const roomCode=generateRoomCode();

const peerId=ROOM_PREFIX+roomCode.toLowerCase();


state.roomId=roomCode;

state.peerRoomId=peerId;


/*
   ÖNEMLİ:
   PeerJS ID artık doğrudan oda kodundan oluşturuluyor.
*/

state.peer=new Peer(peerId);


state.peer.on("open",(id)=>{

state.myId=id;

state.connecting=false;


state.managers=[{

id:id,

name:name,

team:team,

money:BUDGET

}];


state.screen="lobby";

render();

toast("✅ Oda oluşturuldu!");

});


state.peer.on("connection",(connection)=>{

acceptConnection(connection);

});


state.peer.on("error",(error)=>{

console.log("HOST PEER ERROR:",error);


state.connecting=false;


if(error.type==="unavailable-id"){

toast("Oda kodu çakıştı. Tekrar deneyin.");

state.peer=null;

return;

}


toast("❌ Bağlantı hatası.");

});

}


/* =========================================================
   ODAYA KATIL
========================================================= */

function joinRoom(){

const name=document.getElementById("name").value.trim();

const team=document.getElementById("team").value;

const room=document.getElementById("room").value.trim().toUpperCase();


if(!name || !team || !room){

toast("⚠️ Bilgileri eksiksiz doldur.");

return;

}


if(room.length!==6){

toast("⚠️ Oda kodu 6 karakter olmalı.");

return;

}


state.name=name;

state.team=team;

state.roomId=room;

state.isHost=false;

state.connecting=true;


state.peer=new Peer();


state.peer.on("open",(id)=>{

state.myId=id;


const hostPeerId=

ROOM_PREFIX+room.toLowerCase();


const connection=

state.peer.connect(hostPeerId,{

reliable:true

});


state.connections.host=connection;


connection.on("open",()=>{

connection.send({

type:"JOIN",

id:state.myId,

name:name,

team:team

});


state.connecting=false;

state.screen="lobby";

render();

toast("🔗 Odaya bağlandın!");

});


connection.on("data",receiveData);


connection.on("error",(error)=>{

console.log("CONNECTION ERROR:",error);

toast("❌ Host bağlantı hatası.");

});


connection.on("close",()=>{

toast("⚠️ Host bağlantısı kesildi.");

});

});


state.peer.on("error",(error)=>{

console.log("JOIN PEER ERROR:",error);

state.connecting=false;


if(error.type==="peer-unavailable"){

toast("❌ Oda bulunamadı. Oda kodunu kontrol et.");

}

else{

toast("❌ Bağlantı kurulamadı.");

}

});

}


/* =========================================================
   HOST BAĞLANTI KABUL
========================================================= */

function acceptConnection(connection){

connection.on("open",()=>{

console.log("Yeni bağlantı:",connection.peer);

});


connection.on("data",(data)=>{

if(data.type==="JOIN"){

handleJoin(connection,data);

}

else{

handleHostData(data);

}

});


connection.on("error",(error)=>{

console.log("CLIENT CONNECTION ERROR:",error);

});


connection.on("close",()=>{

const id=connection.peer;

delete state.connections[id];

state.managers=

state.managers.filter(m=>m.id!==id);


if(state.gameStarted){

broadcastState();

}

else{

broadcastLobby();

}

});

}


/* =========================================================
   OYUNCU KATILDI
========================================================= */

function handleJoin(connection,data){

if(state.managers.length>=MAX_PLAYERS){

connection.send({

type:"FULL"

});

return;

}


if(state.gameStarted){

connection.send({

type:"STARTED"

});

return;

}


const exists=

state.managers.find(x=>x.id===data.id);


if(!exists){

state.managers.push({

id:data.id,

name:data.name,

team:data.team,

money:BUDGET

});

}


state.connections[data.id]=connection;


/*
   Yeni oyuncuya mevcut durumu gönder
*/

connection.send({

type:"WELCOME",

hostId:state.myId,

players:state.players,

managers:state.managers,

turn:state.turn,

gameStarted:state.gameStarted

});


/*
   Diğer oyunculara yeni listeyi gönder
*/

broadcastLobby();


toast("👤 "+data.name+" odaya katıldı.");

render();

}


/* =========================================================
   HOST GELEN VERİ
========================================================= */

function handleHostData(data){

if(data.type==="PICK"){

hostPick(

data.playerId,

data.managerId

);

}

}


/* =========================================================
   HERKESE GÖNDER
========================================================= */

function broadcast(data){

Object.values(state.connections).forEach(connection=>{

if(connection && connection.open){

try{

connection.send(data);

}catch(e){

console.log(e);

}

}

});

}


/* =========================================================
   LOBİYİ GÜNCELLE
========================================================= */

function broadcastLobby(){

broadcast({

type:"LOBBY",

managers:state.managers,

gameStarted:state.gameStarted

});

render();

}


/* =========================================================
   OYUN BAŞLAT
========================================================= */

function startGame(){

if(!state.isHost){

toast("Sadece oda sahibi başlatabilir.");

return;

}


if(state.managers.length<2){

toast("⚠️ En az 2 oyuncu gerekli.");

return;

}


state.gameStarted=true;

state.turn=0;

state.timer=30;


/*
   Herkese oyunu başlat
*/

broadcast({

type:"GAME_START",

players:state.players,

managers:state.managers,

turn:state.turn

});


state.screen="game";

render();

startTimer();

toast("🚀 Oyun başladı!");

}


/* =========================================================
   SIRADAKİ MENAJER
========================================================= */

function currentManager(){

return state.managers[state.turn] || null;

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

clearInterval(timerInterval);


timerInterval=setInterval(()=>{

if(!state.gameStarted){

clearInterval(timerInterval);

return;

}


state.timer--;


const timerElement=

document.getElementById("timer");


if(timerElement){

timerElement.textContent=state.timer;

}


if(state.timer<=0){

if(state.isHost){

toast("⏰ Süre bitti!");

nextTurn();

}

}

},1000);

}


/* =========================================================
   SIRA DEĞİŞTİR
========================================================= */

function nextTurn(){

if(!state.isHost){

return;

}


if(state.managers.length===0){

return;

}


state.turn++;


if(state.turn>=state.managers.length){

state.turn=0;

}


state.timer=30;


broadcastState();


render();

}


/* =========================================================
   STATE GÖNDER
========================================================= */

function broadcastState(){

broadcast({

type:"STATE",

players:state.players,

managers:state.managers,

turn:state.turn,

timer:state.timer

});

}


/* =========================================================
   OYUNCU AL
========================================================= */

function buyPlayer(id){

const player=

state.players.find(x=>x.id===id);


if(!player){

return;

}


if(!state.gameStarted){

toast("⚠️ Oyun henüz başlamadı.");

return;

}


const manager=currentManager();


if(!manager){

return;

}


if(manager.id!==state.myId){

toast("⏳ Şu anda sıra "+manager.name+" isimli oyuncuda.");

return;

}


if(player.owner){

toast("🔒 Bu futbolcu zaten alındı.");

return;

}


if(manager.money<player.value){

toast("💰 Bu futbolcu için bütçen yetmiyor.");

return;

}


/*
   HOST
*/

if(state.isHost){

hostPick(id,state.myId);

return;

}


/*
   CLIENT
*/

const connection=

state.connections.host;


if(!connection || !connection.open){

toast("❌ Host bağlantısı yok.");

return;

}


connection.send({

type:"PICK",

playerId:id,

managerId:state.myId

});

}


/* =========================================================
   HOST OYUNCU ALIMINI DOĞRULAR
========================================================= */

function hostPick(playerId,managerId){

if(!state.isHost){

return;

}


const manager=

state.managers.find(x=>x.id===managerId);


const player=

state.players.find(x=>x.id===playerId);


if(!manager || !player){

return;

}


/*
   Sıra kontrolü
*/

if(!currentManager() ||

currentManager().id!==managerId){

return;

}


/*
   Oyuncu zaten alınmış mı?
*/

if(player.owner){

return;

}


/*
   Bütçe kontrolü
*/

if(manager.money<player.value){

return;

}


/*
   Oyuncuyu ata
*/

player.owner=managerId;


/*
   Parayı düş
*/

manager.money-=player.value;


/*
   Herkese gönder
*/

broadcast({

type:"PICKED",

player:player,

players:state.players,

managers:state.managers,

turn:state.turn,

timer:state.timer

});


toast(

"⚽ "+player.name+

" → "+manager.name

);


render();


/*
   Kısa bekleme ardından sıra
*/

setTimeout(()=>{

nextTurn();

},900);

}


/* =========================================================
   GELEN VERİ
========================================================= */

function receiveData(data){

console.log("GELEN:",data);


/*
   WELCOME
*/

if(data.type==="WELCOME"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.gameStarted=data.gameStarted;

state.timer=30;


render();

return;

}


/*
   LOBİ
*/

if(data.type==="LOBBY"){

state.managers=data.managers;

state.gameStarted=data.gameStarted;

render();

return;

}


/*
   GAME START
*/

if(data.type==="GAME_START"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.gameStarted=true;

state.timer=30;

state.screen="game";

render();

startTimer();

toast("🚀 Draft başladı!");

return;

}


/*
   OYUNCU ALINDI
*/

if(data.type==="PICKED"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.timer=data.timer || 30;


const player=data.player;


const manager=

state.managers.find(

x=>x.id===player.owner

);


if(manager){

toast(

"🔒 "+player.name+

" → "+manager.name+

" tarafından alındı"

);

}


render();

return;

}


/*
   NORMAL STATE
*/

if(data.type==="STATE"){

state.players=data.players;

state.managers=data.managers;

state.turn=data.turn;

state.timer=data.timer || 30;


render();

return;

}


/*
   ODA DOLU
*/

if(data.type==="FULL"){

toast("❌ Oda dolu. Maksimum 4 kişi.");

return;

}


/*
   OYUN BAŞLAMIŞ
*/

if(data.type==="STARTED"){

toast("❌ Bu oyun zaten başlamış.");

return;

}

}


/* =========================================================
   LOBİ
========================================================= */

const count=state.managers.length;


app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🔑 ODA KODU</h2>

<div class="room">
${state.roomId}
</div>

<div style="text-align:center;color:#9fb0c8">

Bu kodu arkadaşlarına gönder.

</div>

<button class="btn"
onclick="copyRoom()">

📋 KODU KOPYALA

</button>

</div>


<div class="card">

<h3>👥 MENAJERLER (${count}/4)</h3>

${state.managers.map((m,i)=>`

<div class="notice">

<b>

${i===0 ? "👑 " : ""}

${m.name}

</b>

<br>

<span style="color:#9fb0c8">

${m.team}

</span>

<br>

<span style="color:#ffd166">

💰 ${money(m.money)}

</span>

</div>

`).join("")}


${count<2 ? `

<div class="notice">

⏳ En az 2 oyuncu bekleniyor...

</div>

` : `

<div class="notice greenBorder">

✅ ${count} oyuncu hazır.

</div>

`}


${state.isHost ? `

<button

class="btn green"

onclick="startGame()"

${count<2 ? "disabled" : ""}>

🚀 OYUNU BAŞLAT

</button>

` : `

<div class="notice">

⏳ Oda sahibinin oyunu başlatması bekleniyor.

</div>

`}

</div>

<div class="status online">

🟢 İnternet bağlantısı aktif

</div>

`;

}


/* =========================================================
   KOD KOPYALA
========================================================= */

function copyRoom(){

if(!state.roomId){

return;

}


if(navigator.clipboard){

navigator.clipboard.writeText(state.roomId)

.then(()=>{

toast("✅ Oda kodu kopyalandı: "+state.roomId);

})

.catch(()=>{

toast("Oda kodu: "+state.roomId);

});

}else{

toast("Oda kodu: "+state.roomId);

}

}


/* =========================================================
   OYUN
========================================================= */

function game(){

const me=

state.managers.find(x=>x.id===state.myId);


const current=currentManager();


app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>


<div class="top">

<div>

<b>${state.name}</b>

<br>

<span style="color:#9fb0c8">

${state.team}

</span>

</div>

<div class="money">

${money(me ? me.money : BUDGET)}

</div>

</div>


<div class="top">

<div>

<span style="font-size:11px;color:#9fb0c8">

SIRA

</span>

${current ? current.name : "-"}

<div class="timer" id="timer">

<br>

<span style="color:#9fb0c8">

/* =========================================================
   BENİM KADROM
========================================================= */

function mySquad(){

const squad=

state.players.filter(

x=>x.owner===state.myId

);


return `

<div class="pitch">

<div class="pitchTitle">

🏟️ KADROM ${squad.length}/11

</div>


<div class="lineup">

${Array.from({length:11},(_,i)=>{

const p=squad[i];

return `

<div class="slot ${p ? "full" : ""}">

${p ? p.name : "+ "+(i+1)}

</div>

`;

}).join("")}

</div>

</div>

`;

}


/* =========================================================
   OYUNCU LİSTESİ
========================================================= */

function playerList(){

return state.players

.filter(p=>{

if(

state.filter!=="ALL" &&

p.pos!==state.filter

){

return false;

}


if(state.search){

const s=

state.search.toLowerCase();


return (

p.name.toLowerCase().includes(s) ||

p.club.toLowerCase().includes(s)

);

}


return true;

})


.map(p=>{

const owner=

state.managers.find(

m=>m.id===p.owner

);


const isMyTurn=

currentManager() &&

currentManager().id===state.myId;


return `

<div class="player ${p.owner ? "taken" : ""}">

<div class="pos">

${posName(p.pos)}

</div>


<div class="playerName">

${p.name}

</div>


<div class="club">

${p.club}

</div>


<div class="value">

${money(p.value)}

</div>


${p.owner ? `

<div class="notice">

🔒 ${owner ? owner.name : "ALINDI"}

</div>

` : `

<button

onclick="buyPlayer(${p.id})"

${!isMyTurn ? "disabled" : ""}>

💰 KADROYA AL

</button>

`}

</div>

`;

}).join("");

}


/* =========================================================
   ARAMA
========================================================= */

function searchPlayers(value){

state.search=value;


const box=

document.querySelector(".players");


if(box){

box.innerHTML=playerList();

}

}


/* =========================================================
   FİLTRE
========================================================= */

function setFilter(value){

state.filter=value;

render();

}


/* =========================================================
   BAŞLAT
========================================================= */

render();

</script>

</body>
</html>
