/* =====================================================
   OYUNCU VERİSİ

let players=RAW_PLAYERS.map((p,i)=>({
id:i,
pos:p[0],
name:p[1],
club:p[2],
value:p[3],
owner:null
}));

/* =====================================================
   OYUN DURUMU
===================================================== */

let state={
screen:"home",
name:"",
team:"",
room:"",
host:false,
peer:null,
conn:null,
money:BUDGET,
squad:[],
turn:0,
timer:30
};

let filter="ALL";
let searchText="";

const app=document.getElementById("app");
const toastBox=document.getElementById("toast");

/* =====================================================
   YARDIMCI
===================================================== */

function euro(n){

return new Intl.NumberFormat("tr-TR",{
style:"currency",
currency:"EUR",
maximumFractionDigits:0
}).format(n);

}

function toast(text){

toastBox.textContent=text;
toastBox.classList.remove("hidden");

clearTimeout(window.toastTimer);

window.toastTimer=setTimeout(()=>{
toastBox.classList.add("hidden");
},2500);

}

function positionName(p){

if(p==="GK")return"KALECİ";
if(p==="DF")return"DEFANS";
if(p==="MF")return"ORTA SAHA";
return"FORVET";

}

/* =====================================================
   EKRAN
===================================================== */

function render(){

if(state.screen==="home")home();
if(state.screen==="create")create();
if(state.screen==="join")join();
if(state.screen==="lobby")lobby();
if(state.screen==="game")game();

}

/* =====================================================
   ANA SAYFA
===================================================== */

function home(){

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="subtitle">
2026/27 • 2-4 Oyuncu
</div>

<div class="card">

onclick="state.screen='create';render()">
🏠 Oda Oluştur
</button>

</button>

}

function create(){

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🏠 Oda Oluştur</h2>

<input id="name" placeholder="Menajer adın">

<select id="team">

<option value="">Takımını seç</option>
<option>Galatasaray</option>
<option>Fenerbahçe</option>
<option>Beşiktaş</option>
<option>Trabzonspor</option>

</select>

<button class="btn green"
onclick="createRoom()">
Odayı Oluştur
</button>

<button class="btn"
onclick="state.screen='home';render()">
Geri
</button>

</div>

`;

}

/* =====================================================
   ODAYA KATIL
===================================================== */

function join(){

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🚪 Odaya Katıl</h2>

<input id="name" placeholder="Menajer adın">

<select id="team">

<option value="">Takımını seç</option>
<option>Galatasaray</option>
<option>Fenerbahçe</option>
<option>Beşiktaş</option>
<option>Trabzonspor</option>

</select>

<input id="room"
placeholder="Oda kodu">

<button class="btn green"
onclick="joinRoom()">
Odaya Katıl
</button>

<button class="btn"
onclick="state.screen='home';render()">
Geri
</button>

</div>

`;

}

/* =====================================================
   PEERJS
===================================================== */

function createRoom(){

let name=document.getElementById("name").value.trim();
let team=document.getElementById("team").value;

if(!name||!team){

toast("İsim ve takım seçmelisin.");
return;

}

state.name=name;
state.team=team;
state.host=true;

state.peer=new Peer();

state.peer.on("open",id=>{

state.room=id.substring(0,6).toUpperCase();
state.screen="lobby";

render();

toast("Oda oluşturuldu!");

});

state.peer.on("connection",c=>{

state.conn=c;
setupConnection(c);

});

state.peer.on("error",()=>{
toast("Bağlantı hatası.");
});

}

function joinRoom(){

let name=document.getElementById("name").value.trim();
let team=document.getElementById("team").value;
let room=document.getElementById("room").value.trim();

if(!name||!team||!room){

toast("Tüm alanları doldur.");
return;

}

state.name=name;
state.team=team;

state.peer=new Peer();

state.peer.on("open",()=>{

state.conn=state.peer.connect(room.toLowerCase());

setupConnection(state.conn);

state.room=room.toUpperCase();
state.screen="lobby";

render();

});

state.peer.on("error",()=>{
toast("Oda bulunamadı.");
});

}

function setupConnection(c){

c.on("open",()=>{

c.send({
type:"hello",
name:state.name,
team:state.team
});

toast("Bağlantı başarılı!");

});

c.on("data",receiveData);

c.on("close",()=>{
toast("Bağlantı kesildi.");
});

}

function send(data){

if(state.conn&&state.conn.open){
state.conn.send(data);
}

}

/* =====================================================
   LOBİ
===================================================== */

function lobby(){

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="card">

<h2>🏠 Oda</h2>

<div class="room">
${state.room}
</div>

<div style="text-align:center" class="small">
Bu kodu arkadaşlarına gönder.
</div>

</div>

<div class="card">

<h3>👤 Sen</h3>

<div class="notice">
<b>${state.name}</b>
<br>
<span class="small">${state.team}</span>
</div>

${state.host?`

<button class="btn green"
onclick="startGame()">
🚀 Oyunu Başlat
</button>

`:`<div class="notice">
⏳ Oda sahibinin oyunu başlatması bekleniyor.
</div>`}

<button class="btn"
onclick="navigator.clipboard.writeText('${state.room}');toast('Kod kopyalandı!')">
📋 Oda Kodunu Kopyala
</button>

</div>

`;

}

/* =====================================================
   OYUN BAŞLAT
===================================================== */

function startGame(){

state.screen="game";
state.turn=0;
state.timer=30;

render();
startTimer();

send({
type:"start",
players:players
});

}

let timerInterval=null;

function startTimer(){

clearInterval(timerInterval);

timerInterval=setInterval(()=>{

if(state.screen!=="game"){
clearInterval(timerInterval);
return;
}

state.timer--;

let el=document.getElementById("timer");

if(el)el.textContent=state.timer;

if(state.timer<=0){

nextTurn();

}

},1000);

}

function nextTurn(){

state.turn++;

if(state.turn>=4){
state.turn=0;
}

state.timer=30;

send({
type:"state",
players:players,
turn:state.turn
});

render();

}

/* =====================================================
   OYUN EKRANI
===================================================== */

function game(){

let myTurn=state.turn===0;

app.innerHTML=`

<div class="logo">
⚽ SÜPER LİG DRAFT
</div>

<div class="top">

<div>
<b>${state.name}</b>
<br>
<span class="small">${state.team}</span>
</div>

<div class="money">
${euro(state.money)}
</div>

</div>

<div class="top">

<div>
<span class="small">DRAFT SIRASI</span>
<br>
<b>${myTurn?"🔥 SENİN SIRAN":"⏳ RAKİP SEÇİYOR"}</b>
</div>

<div id="timer" class="timer">
${state.timer}
</div>

</div>

<div class="pitch">

<div class="pitchTitle">
🏟️ KADRO (${state.squad.length}/11)
</div>

<div class="lineup">
${lineup()}
</div>

</div>

<div class="card">

<h2>🎯 Oyuncu Havuzu</h2>

<input
class="search"
placeholder="🔎 Oyuncu ara..."
value="${searchText}"
oninput="searchPlayers(this.value)"
>

<div class="tabs">

<button class="tab ${filter==="ALL"?"active":""}"
onclick="setFilter('ALL')">
Tümü
</button>

<button class="tab ${filter==="GK"?"active":""}"
onclick="setFilter('GK')">
Kaleci
</button>

<button class="tab ${filter==="DF"?"active":""}"
onclick="setFilter('DF')">
Defans
</button>

<button class="tab ${filter==="MF"?"active":""}"
onclick="setFilter('MF')">
Orta Saha
</button>

<button class="tab ${filter==="FW"?"active":""}"
onclick="setFilter('FW')">
Forvet
</button>

</div>

<div class="players">
${playerList()}
</div>

</div>

<div class="card">

<h3>📋 Kadrom</h3>

${
state.squad.length===0
?
`<div class="notice">
Henüz oyuncu seçmedin.
</div>`
:
state.squad.map(p=>`

<div class="notice">
<b>${p.name}</b>
<br>
<span class="small">
${p.club} • ${euro(p.value)}
</span>
</div>

`).join("")
}

</div>

<div class="card">

<button class="btn green"
onclick="simulateMatch()">
⚽ MAÇI OYNAT
</button>

</div>

`;

}

/* =====================================================
   SAHA
===================================================== */

function lineup(){

let slots=Array(11).fill(null);

state.squad.forEach((p,i)=>{
if(i<11)slots[i]=p;
});

return slots.map((p,i)=>`

<div class="slot ${p?"full":""}">
${
p
?
`${p.name}<br><span class="small">${p.pos}</span>`
:
`+ ${i+1}`
}
</div>

`).join("");

}

/* =====================================================
   OYUNCU LİSTESİ
===================================================== */

function playerList(){

return players

.filter(p=>filter==="ALL"||p.pos===filter)

.filter(p=>
p.name.toLowerCase().includes(searchText.toLowerCase()) ||
p.club.toLowerCase().includes(searchText.toLowerCase())
)

.map(p=>`

<div class="player ${p.owner?"taken":""}">

<div class="position">
${positionName(p.pos)}
</div>

<div class="playerName">
${p.name}
</div>

<div class="club">
${p.club}
</div>

<div class="value">
${euro(p.value)}
</div>

${
p.owner
?
`<div class="notice">
🔒 ALINDI
</div>`
:
`
<button onclick="buyPlayer(${p.id})">
💰 KADROYA AL
</button>
`
}

</div>

`).join("");

}

/* =====================================================
   ARAMA
===================================================== */

function searchPlayers(value){

searchText=value;

let box=document.querySelector(".players");

if(box){
box.innerHTML=playerList();
}

}

/* =====================================================
   FİLTRE
===================================================== */

function setFilter(value){

filter=value;
render();

}

/* =====================================================
   OYUNCU AL
===================================================== */

function buyPlayer(id){

if(state.turn!==0){

toast("⏳ Şu anda senin sıran değil.");
return;

}

if(state.squad.length>=11){

toast("11 kişilik kadron tamamlandı.");
return;

}

let p=players.find(x=>x.id===id);

if(!p)return;

if(p.owner){

toast("🔒 Bu oyuncuyu başka menajer aldı.");
return;

}

if(state.money<p.value){

toast("💰 Bütçen yetmiyor.");
return;

}

state.money-=p.value;

p.owner=state.name;

state.squad.push(p);

toast("✅ "+p.name+" kadroya katıldı!");

send({
type:"state",
players:players,
turn:state.turn
});

render();

}

/* =====================================================
   MAÇ SİMÜLASYONU
===================================================== */

function simulateMatch(){

if(state.squad.length<11){

toast("⚠️ Önce 11 kişilik kadro kur.");
return;

}

let goals=[
"⚽ GOOOOL! "+state.squad[Math.floor(Math.random()*state.squad.length)].name+" ağları buldu!",
"⚽ Harika bir bitiriş! GOOOOL!",
"❌ Direkten döndü!",
"❌ Kaleci müthiş kurtardı!",
"⚽ Ceza sahasında şut... GOOOOL!",
"❌ Şut az farkla dışarı çıktı!"
];

let i=0;

let match=setInterval(()=>{

toast(goals[Math.floor(Math.random()*goals.length)]);

i++;

if(i>=6){

clearInterval(match);

setTimeout(()=>{
toast("🏁 Maç sona erdi!");
},1200);

}

},1800);

}

/* =====================================================
   MULTIPLAYER VERİ
===================================================== */

function receiveData(data){

if(data.type==="hello"){

toast("👤 "+data.name+" odaya katıldı!");

}

if(data.type==="start"){

players=data.players;

state.screen="game";
state.turn=0;
state.timer=30;

render();
startTimer();

}

if(data.type==="state"){

players=data.players;
state.turn=data.turn;

render();

}

}

/* =====================================================
   BAŞLAT
===================================================== */

render();

</script>

</body>
</html>
